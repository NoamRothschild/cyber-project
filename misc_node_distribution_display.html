    THIS FILE WAS VIBE CODED
    I used AI to be able to see visually and quickly the idea I had in mind
    for separating nodes between servers

    open it in your browser, and you will see the grid of nodes, colored in 5 colors.
    each region in some color represents what one physical server will hold



-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMO Map - Node Distribution Dashboard</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --border: #333;
            --text-dim: rgba(255, 255, 255, 0.45);
            /* Server Colors */
            --c-tl: #00d8ff; --c-tr: #39ff14; --c-bl: #ffaa00; --c-br: #bc13fe; --c-core: #ff3d71;
        }

        body {
            margin: 0; padding: 20px; background-color: var(--bg);
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif; color: white;
            overflow-y: auto;
        }

        canvas {
            background-color: var(--card-bg); display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border); border-radius: 8px;
            max-width: 100%;
        }

        #dashboard {
            width: 95%; margin-top: 30px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px; padding-bottom: 50px;
        }

        .server-card {
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 15px; border-radius: 8px; border-top: 4px solid var(--accent);
        }

        .server-card h3 { margin-top: 0; font-size: 1rem; display: flex; justify-content: space-between; }
        .node-list {
            font-family: 'Cascadia Code', 'Courier New', monospace;
            font-size: 0.75rem; color: var(--text-dim);
            background: #111; padding: 10px; border-radius: 4px;
            max-height: 100px; overflow-y: auto; word-break: break-all;
        }

        .badge { background: #333; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; }
    </style>
</head>
<body>

<canvas id="mapCanvas"></canvas>

<div id="dashboard">
</div>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const dashboard = document.getElementById('dashboard');

    const COLS = 17, ROWS = 20;
    const TARGET_COL = 8, TARGET_ROW = 9;

    const COLORS = {
        core: "rgba(255, 61, 113, 0.45)",
        tl: "rgba(0, 216, 255, 0.35)",
        tr: "rgba(57, 255, 20, 0.30)",
        bl: "rgba(255, 170, 0, 0.35)",
        br: "rgba(188, 19, 254, 0.35)",
        lines: "rgba(255, 255, 255, 0.12)",
        text: "rgba(255, 255, 255, 0.45)"
    }

    function isCoreNode(c, r, cellW, cellH, centerX, centerY, radiusX) {
        if (r === TARGET_ROW || c === TARGET_COL) return true;
        const radiusY = radiusX * 0.8;
        const dx = (c * cellW + cellW/2) - centerX;
        const dy = (r * cellH + cellH/2) - centerY;
        return (dx*dx)/(radiusX*radiusX) + (dy*dy)/(radiusY*radiusY) <= 1;
    }

    function updateDashboard(servers) {
        const labels = {
            S1_TL: { name: "Server 1 (Top-Left)", color: "var(--c-tl)" },
            S2_TR: { name: "Server 2 (Top-Right)", color: "var(--c-tr)" },
            S3_BL: { name: "Server 3 (Bottom-Left)", color: "var(--c-bl)" },
            S4_BR: { name: "Server 4 (Bottom-Right)", color: "var(--c-br)" },
            S5_Core: { name: "Server 5 (Core Ellipse)", color: "var(--c-core)" }
        };

        dashboard.innerHTML = Object.keys(servers).map(key => `
            <div class="server-card" style="--accent: ${labels[key].color}">
                <h3>${labels[key].name} <span class="badge">${servers[key].length} nodes</span></h3>
                <div class="node-list">[${servers[key].join(', ')}]</div>
            </div>
        `).join('');
    }

    function resize() {
        canvas.width = window.innerWidth * 0.95;
        canvas.height = canvas.width * (9 / 16);
        drawAndLogic();
    }

    function drawAndLogic() {
        const cellW = canvas.width / COLS, cellH = canvas.height / ROWS;
        const cX = canvas.width / 2, cY = canvas.height / 2, rX = canvas.height * 0.3;

        const servers = { S1_TL: [], S2_TR: [], S3_BL: [], S4_BR: [], S5_Core: [] };
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Logic & Fill
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const idx = c + r * 17;
                if (isCoreNode(c, r, cellW, cellH, cX, cY, rX)) {
                    ctx.fillStyle = COLORS.core; servers.S5_Core.push(idx);
                } else if (r < TARGET_ROW && c < TARGET_COL) {
                    ctx.fillStyle = COLORS.tl; servers.S1_TL.push(idx);
                } else if (r < TARGET_ROW && c > TARGET_COL) {
                    ctx.fillStyle = COLORS.tr; servers.S2_TR.push(idx);
                } else if (r > TARGET_ROW && c < TARGET_COL) {
                    ctx.fillStyle = COLORS.bl; servers.S3_BL.push(idx);
                } else {
                    ctx.fillStyle = COLORS.br; servers.S4_BR.push(idx);
                }
                ctx.fillRect(c * cellW, r * cellH, cellW, cellH);
            }
        }

        // Lines & Text
        ctx.strokeStyle = COLORS.lines;
        ctx.fillStyle = COLORS.text;
        ctx.font = `600 ${cellH * 0.22}px sans-serif`;
        ctx.textAlign = "center";

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                ctx.strokeRect(c * cellW, r * cellH, cellW, cellH);
                ctx.fillText(c + r * 17, (c * cellW) + (cellW / 2), (r * cellH) + (cellH / 1.7));
            }
        }
        updateDashboard(servers);
    }

    window.addEventListener('resize', resize);
    resize();
</script>

</body>
</html>
